<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Sirène — CV · Portfolio · Présentations</title>
    <style>
        @import "https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap";

        *, :before, :after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #f4f2ed;
            --surface: #fff;
            --border: #e0dbd3;
            --text: #1a1714;
            --sub: #8a8178;
            --accent: #c8401e;
            --accent-s: #f7ece8;
            --cv: #1a3a5c;
            --pf: #2d5a27;
            --pr: #7a2a6e;
            --gold: #b8900a;
            --r: 10px;
            --sh: 0 2px 16px #00000012;
            --sbw: 210px
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: DM Sans, sans-serif;
            font-size: 14px;
            line-height: 1.5
        }

        h1, h2, h3, h4, h5 {
            font-family: Syne, sans-serif
        }

        button, input, select, textarea {
            font-family: DM Sans, sans-serif;
            font-size: 14px
        }

        button {
            cursor: pointer;
            background: 0 0;
            border: none
        }

        textarea {
            resize: vertical
        }

        .auth-wrap {
            min-height: 100vh;
            display: flex
        }

        .auth-left {
            background: var(--text);
            color: #fff;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            padding: 48px 56px;
            display: flex
        }

        .auth-brand {
            align-items: center;
            gap: 10px;
            margin-bottom: 48px;
            display: flex
        }

        .logo-mark {
            color: var(--accent);
            font-size: 26px
        }

        .logo-text {
            letter-spacing: .03em;
            font-family: Syne, sans-serif;
            font-size: 22px;
            font-weight: 700
        }

        .auth-hero h1 {
            margin-bottom: 18px;
            font-size: 44px;
            font-weight: 800;
            line-height: 1.15
        }

        .auth-hero p {
            color: #fff9;
            max-width: 360px;
            font-size: 15px
        }

        .auth-pills {
            flex-wrap: wrap;
            gap: 10px;
            display: flex
        }

        .auth-pills span {
            color: #fffc;
            background: #ffffff1a;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px
        }

        .auth-right {
            background: var(--bg);
            justify-content: center;
            align-items: center;
            width: 460px;
            padding: 48px 36px;
            display: flex
        }

        .auth-card {
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 360px;
            display: flex
        }

        .lang-row {
            gap: 4px;
            display: flex
        }

        .lang-btn {
            color: var(--sub);
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 5px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600
        }

        .lang-btn.active {
            background: var(--text);
            color: #fff;
            border-color: var(--text)
        }

        .auth-tabs {
            border-bottom: 1px solid var(--border);
            display: flex
        }

        .tab {
            color: var(--sub);
            border-bottom: 2px solid #0000;
            margin-bottom: -1px;
            padding: 10px 20px;
            font-weight: 600
        }

        .tab.active {
            color: var(--accent);
            border-color: var(--accent)
        }

        .field {
            flex-direction: column;
            gap: 5px;
            display: flex
        }

        .field label {
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: .05em;
            font-size: 11px;
            font-weight: 700
        }

        .field input, .field textarea, .field select {
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 8px;
            width: 100%;
            padding: 9px 12px;
            transition: border-color .15s
        }

        .field input:focus, .field textarea:focus, .field select:focus {
            border-color: var(--accent);
            outline: none
        }

        .auth-switch {
            text-align: center;
            color: var(--sub);
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline
        }

        .auth-switch:hover {
            color: var(--accent)
        }

        .demo-hint {
            text-align: center;
            color: var(--sub);
            cursor: pointer;
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 6px;
            font-size: 12px
        }

        .demo-hint:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .layout {
            min-height: 100vh;
            display: flex
        }

        .main {
            background: var(--bg);
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto
        }

        .sidebar {
            width: var(--sbw);
            background: var(--text);
            flex-direction: column;
            flex-shrink: 0;
            min-height: 100vh;
            padding: 20px 0;
            display: flex
        }

        .sb-brand {
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
            padding: 0 20px;
            display: flex
        }

        .sb-logo {
            color: var(--accent);
            font-size: 22px
        }

        .sb-name {
            color: #fff;
            font-family: Syne, sans-serif;
            font-size: 18px;
            font-weight: 700
        }

        .sb-nav {
            flex-direction: column;
            flex: 1;
            gap: 3px;
            padding: 0 10px;
            display: flex
        }

        .sb-item {
            color: #ffffff8c;
            text-align: left;
            border-radius: 8px;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            font-weight: 500;
            transition: background .15s, color .15s;
            display: flex
        }

        .sb-item:hover {
            color: #fff;
            background: #ffffff14
        }

        .sb-item.active {
            background: var(--accent);
            color: #fff
        }

        .sb-footer {
            border-top: 1px solid #ffffff1a;
            align-items: center;
            gap: 10px;
            padding: 16px 20px;
            display: flex
        }

        .sb-avatar {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            flex-shrink: 0;
            place-items: center;
            width: 34px;
            height: 34px;
            font-size: 14px;
            font-weight: 700;
            display: grid
        }

        .sb-uname {
            color: #fff;
            font-size: 13px;
            font-weight: 600
        }

        .sb-plan {
            color: #ffffff73;
            font-size: 11px
        }

        .dash-header {
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            display: flex
        }

        .dash-header h1 {
            font-size: 26px;
            font-weight: 800
        }

        .sub {
            color: var(--sub);
            margin-top: 4px;
            font-size: 13px
        }

        .plan-info {
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            display: flex
        }

        .plan-badge {
            color: var(--sub);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600
        }

        .btn-upgrade {
            background: var(--text);
            color: #fff;
            border-radius: 7px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            transition: background .15s
        }

        .btn-upgrade:hover {
            background: var(--accent)
        }

        .stats-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
            display: grid
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            align-items: center;
            gap: 12px;
            padding: 16px;
            display: flex
        }

        .stat-icon {
            font-size: 26px
        }

        .stat-num {
            font-family: Syne, sans-serif;
            font-size: 24px;
            font-weight: 700;
            display: block
        }

        .stat-card small {
            color: var(--sub);
            font-size: 11px
        }

        .stat-card.quota {
            flex-direction: column;
            align-items: flex-start;
            gap: 8px
        }

        .quota-label {
            color: var(--sub);
            font-size: 12px;
            font-weight: 600
        }

        .quota-bar {
            background: var(--border);
            border-radius: 3px;
            width: 100%;
            height: 6px;
            overflow: hidden
        }

        .quota-fill {
            background: var(--accent);
            border-radius: 3px;
            height: 100%;
            transition: width .4s
        }

        .create-row {
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            display: flex
        }

        .create-btn {
            border: 1.5px solid;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            transition: transform .1s, opacity .1s
        }

        .create-btn:hover {
            opacity: .9;
            transform: translateY(-2px)
        }

        .create-btn.cv {
            background: var(--accent-s);
            border-color: var(--cv);
            color: var(--cv)
        }

        .create-btn.portfolio {
            border-color: var(--pf);
            color: var(--pf);
            background: #eaf4ea
        }

        .create-btn.pres {
            border-color: var(--pr);
            color: var(--pr);
            background: #f5eaf5
        }

        .filter-row {
            border-bottom: 1px solid var(--border);
            gap: 4px;
            margin-bottom: 20px;
            display: flex
        }

        .filter-btn {
            color: var(--sub);
            border-bottom: 2px solid #0000;
            align-items: center;
            gap: 6px;
            margin-bottom: -1px;
            padding: 8px 16px;
            font-weight: 500;
            display: flex
        }

        .filter-btn.active {
            color: var(--accent);
            border-color: var(--accent)
        }

        .badge {
            background: var(--border);
            color: var(--sub);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 11px
        }

        .filter-btn.active .badge {
            background: var(--accent-s);
            color: var(--accent)
        }

        .projects-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            display: grid
        }

        .pcard {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            transition: box-shadow .2s, transform .2s;
            overflow: hidden
        }

        .pcard:hover {
            box-shadow: var(--sh);
            transform: translateY(-2px)
        }

        .pcard-bar {
            height: 4px
        }

        .pcard-bar.cv {
            background: var(--cv)
        }

        .pcard-bar.portfolio {
            background: var(--pf)
        }

        .pcard-bar.presentation {
            background: var(--pr)
        }

        .pcard-body {
            align-items: flex-start;
            gap: 14px;
            padding: 16px 16px 12px;
            display: flex
        }

        .pcard-icon {
            flex-shrink: 0;
            font-size: 28px
        }

        .pcard-info h3 {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: 700
        }

        .pcard-tags {
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
            display: flex
        }

        .tag {
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600
        }

        .tag.tag-cv {
            background: var(--accent-s);
            color: var(--cv)
        }

        .tag.tag-portfolio {
            color: var(--pf);
            background: #eaf4ea
        }

        .tag.tag-pres {
            color: var(--pr);
            background: #f5eaf5
        }

        .tag.status-draft {
            color: var(--gold);
            background: #fef9ec
        }

        .tag.status-published {
            color: var(--pf);
            background: #eaf4ea
        }

        .pcard-date {
            color: var(--sub);
            font-size: 11px
        }

        .pcard-actions {
            border-top: 1px solid var(--border);
            gap: 6px;
            padding: 10px 16px;
            display: flex
        }

        .empty {
            color: var(--sub);
            text-align: center;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 72px 24px;
            display: flex
        }

        .empty span {
            opacity: .3;
            font-size: 36px
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            font-weight: 600;
            transition: opacity .15s, transform .1s;
            display: inline-flex
        }

        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px)
        }

        .btn-primary.w-full {
            justify-content: center;
            width: 100%
        }

        .btn-outline {
            border: 1.5px solid var(--border);
            color: var(--text);
            background: var(--surface);
            border-radius: 8px;
            padding: 9px 20px;
            font-weight: 500;
            transition: border-color .15s, color .15s
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .btn-sm {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600
        }

        .btn-sm:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent)
        }

        .btn-sm.outline {
            background: 0 0
        }

        .btn-sm.ghost {
            background: 0 0;
            border-color: #0000
        }

        .btn-back {
            color: var(--sub);
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500
        }

        .btn-back:hover {
            color: var(--accent)
        }

        .btn-add {
            border: 1.5px dashed var(--border);
            color: var(--sub);
            border-radius: 8px;
            width: 100%;
            margin-top: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500
        }

        .btn-add:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .btn-add-sm {
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            flex-shrink: 0;
            place-items: center;
            width: 32px;
            height: 32px;
            font-size: 18px;
            display: grid
        }

        .btn-del {
            color: #c0392b;
            text-align: left;
            margin-top: 4px;
            font-size: 12px
        }

        .mt8 {
            margin-top: 8px
        }

        .mt16 {
            margin-top: 16px
        }

        .mod-header {
            margin-bottom: 28px
        }

        .mod-header h2 {
            margin: 8px 0 16px;
            font-size: 22px;
            font-weight: 700
        }

        .steps {
            display: flex
        }

        .step {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--sub);
            cursor: pointer;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 13px;
            transition: all .15s;
            display: flex
        }

        .step:first-child {
            border-radius: 8px 0 0 8px
        }

        .step:last-child {
            border-radius: 0 8px 8px 0
        }

        .step:not(:first-child) {
            border-left: none
        }

        .step.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600
        }

        .step.done {
            background: var(--accent-s);
            color: var(--accent);
            border-color: var(--accent)
        }

        .sn {
            background: #00000014;
            border-radius: 50%;
            flex-shrink: 0;
            place-items: center;
            width: 20px;
            height: 20px;
            font-size: 11px;
            font-weight: 700;
            display: grid
        }

        .step.active .sn {
            background: #ffffff40
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 24px
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 700
        }

        .tmpl-grid {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            display: grid
        }

        .tmpl-card {
            border: 2px solid var(--border);
            border-radius: var(--r);
            cursor: pointer;
            transition: border-color .15s, transform .15s;
            overflow: hidden
        }

        .tmpl-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px)
        }

        .tmpl-card.sel {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-s)
        }

        .tmpl-card.locked {
            opacity: .55;
            cursor: not-allowed
        }

        .tmpl-thumb {
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            height: 96px;
            padding: 12px;
            display: flex
        }

        .tl {
            background: #ffffffb3;
            border-radius: 2px;
            width: 65%;
            height: 10px
        }

        .tl2 {
            background: #ffffff73;
            border-radius: 2px;
            width: 45%;
            height: 6px
        }

        .tl3 {
            background: #ffffff40;
            border-radius: 2px;
            width: 80%;
            height: 4px
        }

        .tmpl-info {
            background: var(--surface);
            flex-direction: column;
            gap: 4px;
            padding: 10px 12px;
            display: flex
        }

        .tmpl-info strong {
            font-size: 13px;
            font-weight: 700
        }

        .prem {
            color: var(--gold);
            background: #fef9ec;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 700;
            display: inline-block
        }

        .pg-grid {
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            height: 100%;
            padding: 2px;
            display: grid
        }

        .pg-grid div {
            background: #ffffff40;
            border-radius: 3px
        }

        .form-wrap {
            flex-direction: column;
            gap: 0;
            display: flex
        }

        .fsec {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            flex-direction: column;
            gap: 14px;
            margin-bottom: 14px;
            padding: 20px;
            display: flex
        }

        .fsec h4 {
            font-size: 14px;
            font-weight: 700
        }

        .frow {
            flex-wrap: wrap;
            gap: 12px;
            display: flex
        }

        .frow .field {
            flex: 1;
            min-width: 140px
        }

        .sub-entry {
            border-left: 3px solid var(--border);
            flex-direction: column;
            gap: 10px;
            padding-left: 16px;
            display: flex
        }

        .skills-wrap {
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            display: flex
        }

        .skill-chip {
            border: 1.5px solid var(--border);
            background: var(--surface);
            width: 130px;
            color: var(--text);
            border-radius: 8px;
            padding: 6px 12px
        }

        .form-actions {
            justify-content: flex-end;
            gap: 10px;
            margin-top: 12px;
            display: flex
        }

        .radio-group {
            gap: 24px;
            display: flex
        }

        .radio-group label {
            cursor: pointer;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            display: flex
        }

        .preview-wrap {
            flex-direction: column;
            gap: 16px;
            display: flex
        }

        .preview-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            display: flex
        }

        .cv-doc {
            border: 1px solid var(--border);
            border-radius: var(--r);
            max-width: 800px;
            box-shadow: var(--sh);
            background: #fff;
            padding: 48px
        }

        .cv-top {
            margin-bottom: 24px
        }

        .cv-top h1 {
            font-size: 30px;
            font-weight: 800
        }

        .cv-top h2 {
            margin-top: 4px;
            font-size: 16px;
            font-weight: 500
        }

        .cv-contacts {
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 12px;
            display: flex
        }

        .cv-contacts span {
            color: var(--sub);
            font-size: 13px
        }

        .cv-s {
            margin-bottom: 20px
        }

        .cv-s h3 {
            letter-spacing: .1em;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            padding-bottom: 6px;
            font-size: 11px;
            font-weight: 800
        }

        .cv-entry {
            margin-bottom: 10px;
            font-size: 14px
        }

        .cv-eh {
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 600;
            display: flex
        }

        .cv-eh span {
            color: var(--sub);
            font-size: 12px;
            font-weight: 400
        }

        .cv-s p, .cv-entry p {
            color: var(--sub);
            font-size: 13px;
            line-height: 1.6
        }

        .cv-date {
            color: var(--sub);
            margin-left: 8px;
            font-size: 12px
        }

        .cv-skills {
            flex-wrap: wrap;
            gap: 8px;
            display: flex
        }

        .cv-skills span {
            border: 1px solid;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 12px
        }

        .pf-doc {
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: #fff;
            overflow: hidden
        }

        .pf-hero {
            color: #fff;
            padding: 48px 40px
        }

        .pf-hero h1 {
            font-size: 30px;
            font-weight: 800
        }

        .pf-hero p {
            opacity: .75;
            margin-top: 8px
        }

        .pf-about {
            border-bottom: 1px solid var(--border);
            padding: 24px 40px
        }

        .pf-items {
            gap: 16px;
            padding: 24px 40px;
            display: grid
        }

        .pf-items.grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))
        }

        .pf-items.one-page {
            grid-template-columns: 1fr
        }

        .pf-item {
            border: 1px solid var(--border);
            border-radius: var(--r);
            overflow: hidden
        }

        .pf-thumb {
            place-items: center;
            height: 120px;
            display: grid
        }

        .pf-thumb span {
            text-transform: uppercase;
            color: #00000059;
            font-size: 11px;
            font-weight: 700
        }

        .pf-item-info {
            padding: 12px
        }

        .pf-item-info strong {
            font-size: 14px;
            font-weight: 700;
            display: block
        }

        .pf-item-info p {
            color: var(--sub);
            margin-top: 4px;
            font-size: 12px
        }

        .pf-item-info a {
            color: var(--accent);
            margin-top: 6px;
            font-size: 12px;
            display: inline-block
        }

        .slide-editor {
            flex-direction: column;
            gap: 0;
            display: flex
        }

        .slide-panel {
            border: 1px solid var(--border);
            border-radius: var(--r);
            grid-template-columns: 150px 240px 1fr;
            min-height: 400px;
            display: grid;
            overflow: hidden
        }

        .slide-list {
            background: var(--bg);
            border-right: 1px solid var(--border);
            flex-direction: column;
            gap: 6px;
            padding: 12px 8px;
            display: flex;
            overflow-y: auto
        }

        .slide-thumb {
            cursor: pointer;
            border-radius: 7px;
            padding: 8px 10px;
            transition: all .15s
        }

        .slide-num {
            margin-bottom: 4px;
            font-size: 10px;
            display: block
        }

        .st-title {
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 11px;
            font-weight: 600;
            overflow: hidden
        }

        .slide-edit {
            border-right: 1px solid var(--border);
            background: var(--surface);
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            display: flex
        }

        .slide-live {
            flex-direction: column;
            justify-content: space-between;
            min-height: 300px;
            padding: 32px 28px;
            display: flex;
            position: relative
        }

        .sl-title-layout, .sl-content-layout {
            flex-direction: column;
            flex: 1;
            justify-content: center;
            gap: 12px;
            display: flex
        }

        .sl-accent-line {
            border-radius: 2px;
            width: 48px;
            height: 3px;
            margin-bottom: 8px
        }

        .sl-title-layout h2 {
            font-size: 20px;
            font-weight: 800
        }

        .sl-content-layout h3 {
            font-size: 16px;
            font-weight: 700
        }

        .sl-footer {
            text-align: right;
            font-size: 11px
        }

        .slide-prev {
            gap: 7px
        }

        .sp-title {
            border-radius: 2px;
            width: 65%;
            height: 10px
        }

        .sp-sub {
            border-radius: 2px;
            width: 40%;
            height: 6px
        }

        .sp-line {
            border-radius: 2px;
            width: 80%;
            height: 4px
        }

        .slides-full {
            flex-direction: column;
            gap: 16px;
            display: flex
        }

        .sf-slide {
            border-radius: var(--r);
            flex-direction: column;
            justify-content: center;
            min-height: 280px;
            padding: 48px 56px;
            display: flex;
            position: relative
        }

        .sf-title-layout, .sf-content-layout {
            flex-direction: column;
            gap: 14px;
            display: flex
        }

        .sf-accent {
            border-radius: 2px;
            width: 56px;
            height: 4px;
            margin-bottom: 4px
        }

        .sf-title-layout h1 {
            font-size: 32px;
            font-weight: 800
        }

        .sf-content-layout h2 {
            font-size: 22px;
            font-weight: 700
        }

        .sf-num {
            font-size: 12px;
            position: absolute;
            bottom: 16px;
            right: 24px
        }
    </style>
</head>
